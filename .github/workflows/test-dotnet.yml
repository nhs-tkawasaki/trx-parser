name: Test dotnet

on:
  pull_request:

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24]

    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run all

      - name: Run dotnet unit tests
        run: dotnet test --logger trx --results-directory TestResults --configuration Debug
        working-directory: dotnet

      - name: Test with dotnet results
        uses: ./
        with:
          TRX_PATH: ${{ github.workspace }}/dotnet/TestResults
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PREFIX: dotnet-${{ matrix.os }}
